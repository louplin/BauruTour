<!DOCTYPE html>
<!--
  Bauru's Tour - modelo do mini mapa

  Este é o HTML que aparece dentro do mini mapa da tela de detalhes.
  O app (classe MapaHtml.cs) lê este arquivo e troca {{LINK_DO_MAPA}}
  pelo link do lugar que está no arquivo mapas.json.

  O <iframe> é o mesmo código que o Google Maps gera em:
  Compartilhar > Incorporar um mapa > COPIAR HTML
-->
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #E8F2F6; }
    iframe { border: 0; width: 100%; height: 100%; }
  </style>
</head>
<body>
  <iframe src="{{LINK_DO_MAPA}}" allowfullscreen loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
</body>
</html>
